<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - LabPocket</title>

    <!-- CSS Global & Dashboard -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="container">
        <!-- Header / Navigasi Atas -->
        <header class="app-header">
            <div class="header-left">
                <a href="index.html" class="btn-back" aria-label="Kembali">⬅️</a>
                <h1>👨‍🏫 Panel Guru</h1>
            </div>
            <div class="header-right">
                <!-- Tombol Dark Mode -->
                <button id="theme-toggle" class="btn-icon" aria-label="Ubah Tema">🌙</button>
            </div>
        </header>

        <main class="dashboard-content">
            <!-- 1. Form Tambah Tugas Baru -->
            <section class="card teacher-form-card">
                <h2>📝 Tambah Tugas Praktikum Baru</h2>
                <form id="assignment-form">
                    <div class="form-group">
                        <label for="assign-title">Judul Tugas:</label>
                        <input type="text" id="assign-title" placeholder="Contoh: Eksperimen Rangkaian Hambatan Seri" required>
                    </div>

                    <div class="form-group">
                        <label for="assign-subject">Mata Pelajaran:</label>
                        <select id="assign-subject" required>
                            <option value="Fisika">⚛️ Fisika</option>
                            <option value="Kimia">🧬 Kimia</option>
                            <option value="Biologi">🦠 Biologi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="assign-desc">Instruksi & Detail Tugas:</label>
                        <textarea id="assign-desc" rows="3" placeholder="Tulis instruksi pengerjaan untuk siswa..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="assign-deadline">Tenggat Waktu (Deadline):</label>
                        <input type="date" id="assign-deadline" required>
                    </div>

                    <button type="submit" class="btn btn-primary">🚀 Kirim Tugas ke Siswa</button>
                </form>
            </section>

            <!-- 2. Daftar Tugas yang Telah Dibuat -->
            <section class="card teacher-assignments-list-card">
                <h2>📚 Daftar Tugas Aktif</h2>
                <div id="teacher-assignment-list" class="list-container">
                    <p class="empty-msg">Belum ada tugas yang dibuat.</p>
                </div>
            </section>

            <!-- 3. Rekap Presensi Kehadiran Siswa -->
            <section class="card attendance-recap-card">
                <h2>📋 Rekap Presensi Kehadiran Siswa</h2>
                <div class="table-container">
                    <table class="attendance-table">
                        <thead>
                            <tr>
                                <th>Nama Siswa</th>
                                <th>Kelas</th>
                                <th>Waktu Hadir</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body">
                            <tr>
                                <td colspan="3" class="empty-msg">Belum ada data presensi hari ini.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button id="btn-clear-attendance" class="btn btn-secondary mt-3">🧹 Reset Data Presensi</button>
            </section>
        </main>
    </div>

    <!-- Skrip Logika -->
    <script src="js/app.js"></script>
    <script src="js/teacher.js"></script>
</body>
</html>
